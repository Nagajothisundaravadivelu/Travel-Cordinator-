[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-smart-travel-planner"
version = "0.1.0"
description = "CrewAI smart travel planning system"
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai>=0.86.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "PyYAML>=6.0.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
travel-planner = "travel_planner.main:main"
travel-planner-web = "travel_planner.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
travel_planner = ["web/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
